[project]
name = "offall-gateway"
version = "0.1.0"
description = "OFALL AI Gateway & Agent Multi-Provider - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]==2.1.6",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "aiosqlite==0.22.1",
  "arq==0.28.0",
  "redis",
  "litellm==1.106.5",
  "cryptography==50.0.2",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "httpx==0.28.1",
  "pywebpush==2.5.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov",
  "fakeredis==2.40.0",
  "ruff==0.17.3",
  "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
